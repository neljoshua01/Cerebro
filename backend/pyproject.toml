[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebro-backend"
version = "0.1.0"
description = "Reliability-first, human-directed collaborative AI software engineer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
