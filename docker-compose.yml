services:
  cerebro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cerebro
    restart: unless-stopped
    ports:
      - "${CEREBRO_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./workspace:/app/workspace
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
